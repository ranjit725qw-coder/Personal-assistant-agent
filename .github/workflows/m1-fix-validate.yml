name: Fix and validate Milestone 1
on:
  push:
    branches: [refactor/github-foundation]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix remaining command reference
        run: |
          sed -i 's/prepareGitHubWorkBranchCommand(branch)/GitHubWorkCommands.prepareBranch(branch)/g' app/src/main/java/com/jarves/mh/ui/MainViewModel.kt
          rm -f milestone1-validation.txt
          git diff --check
      - name: Validate
        run: ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace
      - name: Record validated implementation
        run: |
          rm .github/workflows/m1-fix-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix and validate Milestone 1 GitHub foundation'
          git push