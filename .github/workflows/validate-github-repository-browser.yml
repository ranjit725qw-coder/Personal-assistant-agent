name: Validate GitHub repository browser
on:
  push:
    branches: [feature/github-repository-browser]
    paths:
      - 'app/**'
      - 'scripts/repo-browser.b64.*'
      - '.github/workflows/validate-github-repository-browser.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply repository browser patch
        id: patch
        continue-on-error: true
        run: |
          if grep -q 'data class GitHubRepository' app/src/main/java/com/jarves/mh/ui/GitHubConnectSupport.kt; then
            echo 'Repository browser implementation already present' > github-repository-browser-validation.txt
          else
            cat scripts/repo-browser.b64.* | base64 -d | gzip -d > /tmp/add_github_repo_browser.py
            python3 /tmp/add_github_repo_browser.py > github-repository-browser-validation.txt 2>&1
          fi
          git diff --check >> github-repository-browser-validation.txt 2>&1
      - uses: actions/setup-java@v5
        if: steps.patch.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        if: steps.patch.outcome == 'success'
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile, test, lint and assemble
        if: steps.patch.outcome == 'success'
        id: gradle
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace >> github-repository-browser-validation.txt 2>&1
      - name: Commit diagnostics
        if: always()
        run: |
          echo "PATCH=${{ steps.patch.outcome }}" >> github-repository-browser-validation.txt
          echo "VALIDATION=${{ steps.gradle.outcome }}" >> github-repository-browser-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src github-repository-browser-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Validate GitHub repository browser"
            git push
          fi
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.gradle.outcome }}" = "success"
