name: Validate Notion-style thinking UI
on:
  push:
    branches: [feature/notion-style-thinking-ui]
    paths:
      - 'scripts/notion-thinking-ui.b64.*'
      - '.github/workflows/validate-notion-thinking-ui.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply UI patch
        id: patch
        continue-on-error: true
        run: |
          if ! rg -q 'private fun ActivityTimelineRow' app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt; then
            cat scripts/notion-thinking-ui.b64.* | base64 -d | gzip -d > /tmp/notion-thinking-ui.patch
            patch -p1 < /tmp/notion-thinking-ui.patch
          fi
          git diff --check
      - uses: actions/setup-java@v5
        if: steps.patch.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        if: steps.patch.outcome == 'success'
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile test lint and assemble
        id: gradle
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace > notion-thinking-ui-validation.txt 2>&1
      - name: Commit implementation and diagnostics
        if: always()
        run: |
          echo "PATCH=${{ steps.patch.outcome }}" >> notion-thinking-ui-validation.txt
          echo "VALIDATION=${{ steps.gradle.outcome }}" >> notion-thinking-ui-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt notion-thinking-ui-validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Implement and validate Notion-style thinking UI"
            git push
          fi
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.gradle.outcome }}" = "success"
# Trigger after workflow registration.
