name: Full-screen preview validation
on:
  push:
    branches: [feature/fullscreen-preview]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply implementation
        run: |
          echo '' | base64 -d | gzip -d > /tmp/fullscreen.patch
          git apply --check /tmp/fullscreen.patch
          git apply /tmp/fullscreen.patch
          git diff --check
      - name: Compile and test
        run: ./gradlew compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace
      - name: Commit validated implementation
        run: |
          rm .github/workflows/fullscreen-preview-validate.yml
          git add app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt .github/workflows/fullscreen-preview-validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Add full-screen website preview mode'
          git push
