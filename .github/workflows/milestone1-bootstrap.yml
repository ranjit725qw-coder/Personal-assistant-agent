name: Bootstrap GitHub foundation implementation
on:
  push:
    branches: [refactor/github-foundation]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply implementation
        run: |
          echo '' | base64 -d | gzip -d > /tmp/m1.patch
          git apply --check /tmp/m1.patch
          git apply /tmp/m1.patch
          git diff --check
          rm .github/workflows/milestone1-validate.yml .github/workflows/milestone1-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refactor GitHub Work Mode foundation'
          git push