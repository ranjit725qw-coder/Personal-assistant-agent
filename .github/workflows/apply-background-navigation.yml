name: Apply background navigation patch

on:
  push:
    branches:
      - sync/background-task-navigation
    paths:
      - patches/background-task-navigation.patch
      - .github/workflows/apply-background-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/background-task-navigation
      - name: Apply patch once
        shell: bash
        run: |
          if git apply --check patches/background-task-navigation.patch; then
            git apply patches/background-task-navigation.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt
            git commit -m "Keep active tasks running during navigation"
            git push
          else
            echo "Patch already applied or no longer matches; no changes made."
          fi
