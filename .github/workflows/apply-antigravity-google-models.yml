name: Apply Antigravity Google models
on:
  push:
    branches: [sync/antigravity-google-models]
    paths:
      - scripts/apply_antigravity_google_models.py
      - .github/workflows/apply-antigravity-google-models.yml
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/antigravity-google-models
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply Google model selector and compile
        shell: bash
        run: |
          set +e
          python3 scripts/apply_antigravity_google_models.py
          status=$?
          if [ "$status" -eq 0 ]; then chmod +x gradlew; ./gradlew compileOnlineReleaseKotlin --stacktrace > /tmp/google-models.log 2>&1; status=$?; fi
          mkdir -p diagnostics
          tail -n 1000 /tmp/google-models.log 2>/dev/null > diagnostics/antigravity-google-models-validation.txt || true
          printf '%s\n' "$status" > diagnostics/antigravity-google-models-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f app/src/main/java diagnostics
          git commit -m 'Add Google AI model discovery for Antigravity' || true
          git push
          exit "$status"
