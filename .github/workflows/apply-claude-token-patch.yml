name: Apply Claude token bridge patch

on:
  push:
    branches:
      - sync/claude-token-isolation
    paths:
      - patches/claude-token-pool.patch
      - .github/workflows/apply-claude-token-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/claude-token-isolation
      - name: Apply patch once
        shell: bash
        run: |
          if git apply --check patches/claude-token-pool.patch; then
            git apply patches/claude-token-pool.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/jarves/mh/runtime/ClaudeRuntimeBridge.kt
            git commit -m "Use saved Claude subscription tokens at runtime"
            git push
          else
            echo "Patch already applied or no longer matches; no changes made."
          fi
