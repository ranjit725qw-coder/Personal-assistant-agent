name: Capture fixed Milestone 1 validation
on:
  push:
    branches: [refactor/github-foundation]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fix remaining reference
        run: sed -i 's/prepareGitHubWorkBranchCommand(branch)/GitHubWorkCommands.prepareBranch(branch)/g' app/src/main/java/com/jarves/mh/ui/MainViewModel.kt
      - name: Validate
        continue-on-error: true
        run: ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace > milestone1-validation-2.txt 2>&1
      - name: Save fix and output
        run: |
          rm -f .github/workflows/m1-fix-validate.yml .github/workflows/m1-fix-diagnostic.yml
          rm -f milestone1-validation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Milestone 1 fix and save validation'
          git push