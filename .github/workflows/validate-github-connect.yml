name: Validate GitHub Connect
on:
  push:
    branches: [feature/github-cli-connect]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - run: python3 scripts/add_github_connect.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile and test
        id: gradle
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace > github-connect-validation.txt 2>&1
      - name: Record result
        if: always()
        run: |
          echo "VALIDATION=${{ steps.gradle.outcome }}" >> github-connect-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src github-connect-validation.txt
          git commit -m "Implement GitHub CLI device connection"
          git push
          test "${{ steps.gradle.outcome }}" = "success"
