name: PR27 release validation
on:
  push:
    branches: [feature/automatic-preview-server]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate diff
        run: git diff --check HEAD~1 HEAD
      - name: Compile, test, lint, and assemble
        run: ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace
      - name: Record successful validation
        run: |
          rm .github/workflows/pr27-validate.yml
          git add .github/workflows/pr27-validate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Validate automatic preview build'
          git push
