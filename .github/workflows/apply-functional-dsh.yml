name: Clean DeepSeek integration helpers

on:
  push:
    branches:
      - sync/functional-deepseek-runtime
    paths:
      - .github/workflows/apply-functional-dsh.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/functional-deepseek-runtime
      - name: Remove temporary integration files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/apply_functional_dsh.py \
            scripts/fix_functional_dsh_script.py \
            scripts/adapt_functional_dsh.py \
            diagnostics/functional-dsh-status.txt \
            diagnostics/functional-dsh-validation.txt \
            .github/workflows/apply-functional-dsh.yml
          rmdir diagnostics 2>/dev/null || true
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary DeepSeek integration helpers"
          git push
