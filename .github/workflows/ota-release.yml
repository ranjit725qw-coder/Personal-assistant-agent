# OTA Release pipeline for Personal Assistant (ONLINE edition).
# Every push to main that touches the app builds a small SIGNED online APK
# (~45 MB), publishes a GitHub Release (tag ota-<versionCode>) with the APK +
# mobile-harness-update.json, so the installed app auto-detects the update
# and offers one-click in-app update (Phase 1: dashboard card).
#
# Runtime (Ubuntu/Python/Android) is downloaded once on first launch and lives
# in app-private storage, which Android preserves across APK updates — so
# every OTA after that costs only ~45 MB. The manifest carries the online APK
# under BOTH "online" and "offline" keys so phones still on the old offline
# build (ota-101) migrate seamlessly with runtime intact.
name: OTA Release (signed, online)

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/ota-release.yml'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, NDK, CMake)
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
        shell: bash

      - name: Restore release keystore
        run: |
          echo "${{ secrets.MH_UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore restored: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"
        shell: bash

      - name: Build signed online APK (~45 MB)
        run: |
          chmod +x gradlew
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "OTA_CODE=$CODE" >> "$GITHUB_ENV"
          echo "OTA_NAME=$NAME" >> "$GITHUB_ENV"
          ./gradlew assembleOnlineRelease -PappVersionCode="$CODE" -PappVersionName="$NAME" --stacktrace
        shell: bash
        env:
          MH_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.jks
          MH_UPLOAD_STORE_PASSWORD: ${{ secrets.MH_UPLOAD_STORE_PASSWORD }}
          MH_UPLOAD_KEY_ALIAS: ${{ secrets.MH_UPLOAD_KEY_ALIAS }}
          MH_UPLOAD_KEY_PASSWORD: ${{ secrets.MH_UPLOAD_KEY_PASSWORD }}

      - name: Prepare release files (APK + manifest + notes)
        run: |
          APK_SRC="app/build/outputs/apk/online/release/app-online-release.apk"
          test -f "$APK_SRC" || { echo "APK not found!"; exit 1; }
          mkdir -p dist/ota
          APK="dist/ota/personal-assistant-online-v${OTA_CODE}.apk"
          cp "$APK_SRC" "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(wc -c < "$APK")
          echo "APK: $APK (${SIZE} bytes)"
          echo "SHA-256: $SHA"
          git log --pretty=format:'- %s (%h)' -8 > dist/ota/changelog.txt
          python3 - "$OTA_CODE" "$OTA_NAME" "$SHA" "$SIZE" <<'PYEOF'
          import json, sys
          code, name, sha, size = sys.argv[1], sys.argv[2], sys.argv[3], int(sys.argv[4])
          notes = open("dist/ota/changelog.txt", encoding="utf-8").read().strip()
          url = f"https://github.com/ranjit725qw-coder/Personal-assistant-agent/releases/download/ota-{code}/personal-assistant-online-v{code}.apk"
          artifact = {"url": url, "sha256": sha, "sizeBytes": size}
          manifest = {
              "versionCode": int(code),
              "versionName": name,
              "notes": f"Personal Assistant {name} (OTA {code}, online edition ~45 MB). Latest changes:\n{notes}",
              "artifacts": {"online": artifact, "offline": artifact},
          }
          open("dist/ota/mobile-harness-update.json", "w", encoding="utf-8").write(json.dumps(manifest, indent=2) + "\n")
          print(open("dist/ota/mobile-harness-update.json", encoding="utf-8").read())
          PYEOF
        shell: bash

      - name: Publish GitHub Release
        run: |
          gh release create "ota-${OTA_CODE}" \
            --title "Personal Assistant v${OTA_NAME} (OTA ${OTA_CODE}, online)" \
            --notes-file dist/ota/changelog.txt \
            "dist/ota/personal-assistant-online-v${OTA_CODE}.apk" \
            dist/ota/mobile-harness-update.json
          echo "Released: https://github.com/ranjit725qw-coder/Personal-assistant-agent/releases/tag/ota-${OTA_CODE}"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
