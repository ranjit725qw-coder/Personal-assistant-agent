# Custom build for YOUR fork of Mobile-Harness (with voice features).
# No PC needed: push any change and GitHub's server builds the APK for you.
# Default = offline APK (~820 MB, Ubuntu+Python+Android pre-packed).
# To build the small online APK instead: Actions tab > this workflow >
# "Run workflow" > flavor = online.
name: Build Custom APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      flavor:
        description: "APK flavor"
        required: false
        default: "offline"
        type: choice
        options: [offline, online]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, NDK, CMake)
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
        shell: bash

      - name: Download runtime bundles (offline flavor only)
        if: ${{ github.event.inputs.flavor != 'online' }}
        run: |
          mkdir -p dist/runtime-bundles
          BASE="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
          curl -L --fail --retry 3 -o dist/runtime-bundles/pocketdev-core-arm64-2026.09.4.tar.zst "$BASE/pocketdev-core-arm64-2026.09.4.tar.zst"
          curl -L --fail --retry 3 -o dist/runtime-bundles/pocketdev-python-arm64-2026.09.2.tar.zst "$BASE/pocketdev-python-arm64-2026.09.2.tar.zst"
          curl -L --fail --retry 3 -o dist/runtime-bundles/pocketdev-android-arm64-2026.09.1.tar.zst "$BASE/pocketdev-android-arm64-2026.09.1.tar.zst"
          echo "6b60d21c3441fe0b127baadded253371fa585525e60871fb814ca29b4fed0de0  dist/runtime-bundles/pocketdev-core-arm64-2026.09.4.tar.zst" | sha256sum -c -
          echo "6b3f56f7743fec142bc045db3ea561ee83fe89af87c2799165ef60351164ef85  dist/runtime-bundles/pocketdev-python-arm64-2026.09.2.tar.zst" | sha256sum -c -
          echo "01bea058ebcb17416d1eb08c0211b3782da3228eb3c8348eb3719f2d61dd3ec6  dist/runtime-bundles/pocketdev-android-arm64-2026.09.1.tar.zst" | sha256sum -c -
        shell: bash

      - name: Build APK
        run: |
          chmod +x gradlew
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ "$FLAVOR" = "online" ]; then
            ./gradlew assembleOnlineDebug --stacktrace
          else
            ./gradlew assembleOfflineDebug --stacktrace
          fi
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-custom-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
