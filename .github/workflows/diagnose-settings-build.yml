name: Clean settings build diagnostics

on:
  push:
    branches:
      - fix/settings-build-release
    paths:
      - .github/workflows/diagnose-settings-build.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/settings-build-release
      - name: Remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            build-diagnostics.txt \
            scripts/fix_nvidia_provider_ui.py \
            .github/workflows/diagnose-settings-build.yml
          git commit -m "Remove temporary build diagnostics"
          git push
