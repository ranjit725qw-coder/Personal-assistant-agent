name: Capture Milestone 1 diagnostics
on:
  push:
    branches: [refactor/github-foundation]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run validation
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace 2>&1 | tee milestone1-validation.log
      - name: Save diagnostics
        run: |
          rm -f .github/workflows/m1-final-validate.yml .github/workflows/m1-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Capture Milestone 1 validation result'
          git push
      - name: Preserve failure
        if: steps.validate.outcome != 'success'
        run: exit 1