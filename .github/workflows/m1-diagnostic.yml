name: Capture Milestone 1 validation output
on:
  push:
    branches: [refactor/github-foundation]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate
        continue-on-error: true
        run: ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace > milestone1-validation.txt 2>&1
      - name: Save output
        run: |
          rm .github/workflows/m1-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f milestone1-validation.txt
          git add -A
          git commit -m 'Save Milestone 1 validation output'
          git push