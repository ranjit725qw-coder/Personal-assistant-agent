name: PR27 bootstrap and validate
on:
  push:
    branches: [feature/automatic-preview-server]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply implementation
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/pr27.patch
          git apply --check /tmp/pr27.patch
          git apply /tmp/pr27.patch
          git diff --check
      - name: Compile, test, lint, and assemble
        run: ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace
      - name: Commit validated implementation
        run: |
          rm .github/workflows/pr27-bootstrap.yml
          git add app/src/main/java/com/jarves/mh/ui/MainViewModel.kt app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt .github/workflows/pr27-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Add automatic self-healing website previews'
          git push
