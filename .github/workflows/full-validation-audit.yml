name: Full validation audit
on:
  push:
    branches: [audit/full-validation-after-pr19]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Source integrity checks
        run: |
          git diff --check
          test ! -e validation.txt
          test ! -e scripts/implement_ai_usage_dashboard.py
          test ! -e scripts/fix_usage_ui.py
      - name: Compile, unit test, lint and assemble
        id: gradle
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineRelease --stacktrace > audit-result.txt 2>&1
      - name: Persist audit result
        if: always()
        shell: bash
        run: |
          set -e
          echo >> audit-result.txt
          echo "AUDIT_OUTCOME=${{ steps.gradle.outcome }}" >> audit-result.txt
          tail -n 500 audit-result.txt > audit-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audit-result.txt audit-tail.txt
          git commit -m "Record full validation audit result"
          git push
          test "${{ steps.gradle.outcome }}" = "success"
