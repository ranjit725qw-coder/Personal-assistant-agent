name: Clean chat workflow validation artifacts
on:
  push:
    branches: [feature/chat-github-orchestration]
    paths: ['.github/workflows/validate-chat-github.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove temporary validation files
        run: |
          rm -f scripts/chat-orchestration.b64.*
          rm -f app/src/main/java/com/jarves/mh/ui/MainViewModel.kt.rej
          rm -f app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt.rej
          rm -f chat-github-validation.txt
          rm -f .github/workflows/validate-chat-github.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary chat workflow validation artifacts"
          git push
