name: Validate chat-driven GitHub workflow
on:
  push:
    branches: [feature/chat-github-orchestration]
    paths:
      - 'scripts/chat-orchestration.b64.*'
      - '.github/workflows/validate-chat-github.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply implementation
        id: patch
        continue-on-error: true
        run: |
          cat scripts/chat-orchestration.b64.* | base64 -d > /tmp/payload.tar.gz
          mkdir -p /tmp/chat-payload
          tar -xzf /tmp/payload.tar.gz -C /tmp/chat-payload
          patch -p1 < /tmp/chat-payload/chat-orchestration.patch
          cp /tmp/chat-payload/app/src/main/java/com/jarves/mh/ui/GitHubConnectSupport.kt app/src/main/java/com/jarves/mh/ui/GitHubConnectSupport.kt
          cp /tmp/chat-payload/app/src/test/java/com/jarves/mh/ui/GitHubConnectSupportTest.kt app/src/test/java/com/jarves/mh/ui/GitHubConnectSupportTest.kt
          git diff --check
      - uses: actions/setup-java@v5
        if: steps.patch.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        if: steps.patch.outcome == 'success'
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile test lint and assemble
        id: gradle
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace > chat-github-validation.txt 2>&1
      - name: Commit implementation and diagnostics
        if: always()
        run: |
          echo "PATCH=${{ steps.patch.outcome }}" >> chat-github-validation.txt
          echo "VALIDATION=${{ steps.gradle.outcome }}" >> chat-github-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src chat-github-validation.txt
          git commit -m "Implement and validate chat-driven GitHub workflow"
          git push
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.gradle.outcome }}" = "success"
