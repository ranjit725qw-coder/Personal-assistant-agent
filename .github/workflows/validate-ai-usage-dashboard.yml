name: Validate AI usage dashboard
on:
  push:
    branches: [feature/ai-usage-key-dashboard]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Apply implementation
        run: |
          python3 scripts/implement_ai_usage_dashboard.py
          python3 scripts/fix_usage_ui.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile and commit
        run: |
          chmod +x gradlew
          ./gradlew compileOnlineReleaseKotlin --stacktrace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch validation.txt
          git add app/src/main/java/com/jarves/mh/data/AiUsageStore.kt app/src/main/java/com/jarves/mh/ui/MainViewModel.kt app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt
          git commit -m "Add daily AI usage and API key dashboard"
          git push
