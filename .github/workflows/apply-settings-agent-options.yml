name: Apply settings agent options

on:
  push:
    branches:
      - sync/settings-agent-provider-options
    paths:
      - patches/settings-agent-provider-options.patch
      - .github/workflows/apply-settings-agent-options.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/settings-agent-provider-options
      - name: Apply integration patch once
        shell: bash
        run: |
          if git apply --check patches/settings-agent-provider-options.patch; then
            git apply patches/settings-agent-provider-options.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java
            git commit -m "Add coding agent and NVIDIA NIM settings options"
            git push
          else
            echo "Patch already applied or no longer matches; no changes made."
          fi
