name: Apply settings agent options

on:
  push:
    branches:
      - sync/settings-agent-provider-options
    paths:
      - patches/settings-options/**
      - .github/workflows/apply-settings-agent-options.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/settings-agent-provider-options
      - name: Apply isolated integration patches
        shell: bash
        run: |
          set -u
          applied=0
          failed=0
          for patch in patches/settings-options/*.patch; do
            if git apply --check "$patch"; then
              git apply "$patch"
              git add app/src/main/java
              git commit -m "Apply $(basename "$patch" .patch) settings integration"
              applied=1
            else
              echo "::error::Could not apply $patch"
              failed=1
            fi
          done
          if [ "$applied" -eq 1 ]; then git push; fi
          exit "$failed"
