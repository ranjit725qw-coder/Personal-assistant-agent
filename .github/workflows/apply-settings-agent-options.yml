name: Clean settings migration assets

on:
  push:
    branches:
      - sync/settings-agent-provider-options
    paths:
      - .github/workflows/apply-settings-agent-options.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/settings-agent-provider-options
      - name: Remove temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch \
            patches/settings-agent-provider-options.patch \
            patches/settings-options \
            scripts/apply_settings_options.py \
            .github/workflows/apply-settings-agent-options.yml
          git commit -m "Remove temporary settings migration assets"
          git push
