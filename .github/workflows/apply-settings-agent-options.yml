name: Apply settings agent options

on:
  push:
    branches:
      - sync/settings-agent-provider-options
    paths:
      - scripts/apply_settings_options.py
      - .github/workflows/apply-settings-agent-options.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/settings-agent-provider-options
      - name: Apply deterministic source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_settings_options.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if git diff --cached --quiet; then
            echo "Settings integration already applied."
          else
            git commit -m "Add coding agent and NVIDIA NIM settings options"
            git push
          fi
