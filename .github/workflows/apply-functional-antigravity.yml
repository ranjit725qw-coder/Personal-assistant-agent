name: Apply functional Antigravity runtime
on:
  push:
    branches: [sync/functional-antigravity-runtime]
    paths:
      - scripts/fix_antigravity_selection.py
      - .github/workflows/apply-functional-antigravity.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync/functional-antigravity-runtime
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Fix selection, compile, and record
        shell: bash
        run: |
          set +e
          python3 scripts/fix_antigravity_selection.py
          status=$?
          if [ "$status" -eq 0 ]; then chmod +x gradlew; ./gradlew compileOnlineReleaseKotlin --stacktrace > /tmp/antigravity.log 2>&1; status=$?; fi
          tail -n 1000 /tmp/antigravity.log 2>/dev/null > diagnostics/functional-antigravity-validation.txt || true
          printf '%s\n' "$status" > diagnostics/functional-antigravity-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f app/src/main/java diagnostics
          git commit -m 'Fix Antigravity model selection and record validation' || true
          git push
          exit "$status"
