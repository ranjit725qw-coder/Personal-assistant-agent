name: Final Milestone 1 validation
on:
  push:
    branches: [refactor/github-foundation]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check diff
        run: git diff --check origin/main...HEAD
      - name: Validate release and debug targets
        run: ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace
      - name: Record success
        run: |
          rm .github/workflows/m1-final-validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate Milestone 1 GitHub foundation'
          git push