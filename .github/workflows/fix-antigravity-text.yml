name: Clean Antigravity validation workflow
on:
  push:
    branches: [fix/antigravity-status-message-v2]
    paths: [.github/workflows/fix-antigravity-text.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/antigravity-status-message-v2
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/fix-antigravity-text.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Antigravity validation workflow'
          git push
