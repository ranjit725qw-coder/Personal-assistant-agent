name: Validate GitHub Connect hardening
on:
  push:
    branches: [fix/github-connect-hardening]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply focused hardening patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/harden_github_connect.py
          python3 /tmp/harden_github_connect.py
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Compile, test, lint and assemble
        id: gradle
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew clean compileOnlineReleaseKotlin testOnlineReleaseUnitTest lintOnlineRelease assembleOnlineDebug --stacktrace > github-connect-hardening-validation.txt 2>&1
      - name: Commit implementation and validation result
        if: always()
        run: |
          echo "VALIDATION=${{ steps.gradle.outcome }}" >> github-connect-hardening-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src github-connect-hardening-validation.txt
          git commit -m "Harden GitHub Connect lifecycle and credentials"
          git push
          test "${{ steps.gradle.outcome }}" = "success"
