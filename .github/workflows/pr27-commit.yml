name: PR27 commit implementation
on:
  push:
    branches: [feature/automatic-preview-server]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit implementation
        shell: bash
        run: |
          B64=$(sed -n "s/.*echo '\([^']*\)'.*/\1/p" .github/workflows/pr27-bootstrap.yml)
          test -n "$B64"
          echo "$B64" | base64 -d | gzip -d > /tmp/pr27.patch
          git apply --check /tmp/pr27.patch
          git apply /tmp/pr27.patch
          git diff --check
          rm .github/workflows/pr27-bootstrap.yml .github/workflows/pr27-commit.yml
          git add app/src/main/java/com/jarves/mh/ui/MainViewModel.kt app/src/main/java/com/jarves/mh/ui/PocketDevApp.kt .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Add automatic self-healing website previews'
          git push
